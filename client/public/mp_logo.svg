<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="500" height="500" rx="40" fill="#0f0f1a"/>

  <!-- Subtle grid lines (web dev feel) -->
  <g stroke="#1e1e3a" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
  </g>

  <!-- Stock market chart (bottom right, subtle) -->
  <polyline
    points="320,390 345,370 365,380 390,345 415,355 440,310 465,320"
    fill="none" stroke="#7c6bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <!-- Area fill under chart -->
  <polygon
    points="320,390 345,370 365,380 390,345 415,355 440,310 465,320 465,410 320,410"
    fill="#7c6bff" opacity="0.07"/>
  <!-- Chart dots -->
  <circle cx="390" cy="345" r="3" fill="#7c6bff" opacity="0.7"/>
  <circle cx="440" cy="310" r="3" fill="#ff6b9d" opacity="0.9"/>

  <!-- Candlestick bars (share market) - left side -->
  <g opacity="0.45">
    <rect x="40" y="340" width="8" height="30" rx="2" fill="#4ade80"/>
    <line x1="44" y1="335" x2="44" y2="375" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="56" y="330" width="8" height="40" rx="2" fill="#4ade80"/>
    <line x1="60" y1="324" x2="60" y2="374" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="72" y="350" width="8" height="20" rx="2" fill="#ff6b9d"/>
    <line x1="76" y1="345" x2="76" y2="374" stroke="#ff6b9d" stroke-width="1.5"/>
    <rect x="88" y="338" width="8" height="32" rx="2" fill="#4ade80"/>
    <line x1="92" y1="332" x2="92" y2="374" stroke="#4ade80" stroke-width="1.5"/>
  </g>

  <!-- Code brackets (web dev) - top left -->
  <g fill="none" stroke="#7c6bff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <polyline points="42,68 30,82 42,96"/>
    <polyline points="58,68 70,82 58,96"/>
  </g>
  <!-- Slash between brackets -->
  <line x1="52" y1="68" x2="48" y2="96" stroke="#ff6b9d" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Code brackets top right -->
  <g fill="none" stroke="#7c6bff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <polyline points="432,55 420,69 432,83"/>
    <polyline points="448,55 460,69 448,83"/>
  </g>
  <line x1="442" y1="55" x2="438" y2="83" stroke="#ff6b9d" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- Decorative circuit nodes top -->
  <circle cx="250" cy="36" r="4" fill="none" stroke="#7c6bff" stroke-width="1.5" opacity="0.4"/>
  <circle cx="270" cy="36" r="2.5" fill="#7c6bff" opacity="0.4"/>
  <line x1="254" y1="36" x2="267" y2="36" stroke="#7c6bff" stroke-width="1" opacity="0.4"/>
  <line x1="250" y1="40" x2="250" y2="52" stroke="#7c6bff" stroke-width="1" opacity="0.3"/>

  <!-- Rising arrow (market / growth) bottom left -->
  <g opacity="0.4">
    <line x1="40" y1="440" x2="100" y2="400" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
    <polygon points="100,394 106,408 94,408" fill="#4ade80"/>
  </g>

  <!-- Main logo card -->
  <rect x="120" y="110" width="260" height="240" rx="28" fill="#1a1a2e"/>
  <rect x="122" y="112" width="256" height="236" rx="26" fill="none" stroke="#7c6bff" stroke-width="1.5"/>
  <rect x="128" y="118" width="244" height="224" rx="22" fill="none" stroke="#ff6b9d" stroke-width="0.5" opacity="0.35"/>

  <!-- M letter -->
  <text x="150" y="306" font-family="Georgia, 'Times New Roman', serif" font-size="152" font-weight="700" fill="#ffffff" letter-spacing="-4">M</text>

  <!-- P letter -->
  <text x="285" y="306" font-family="Georgia, 'Times New Roman', serif" font-size="152" font-weight="700" fill="#7c6bff" letter-spacing="-4">P</text>

  <!-- Underline bars -->
  <rect x="130" y="328" width="72" height="3" rx="2" fill="#ff6b9d"/>
  <rect x="210" y="328" width="72" height="3" rx="2" fill="#7c6bff"/>
  <rect x="290" y="328" width="72" height="3" rx="2" fill="#ff6b9d" opacity="0.45"/>

  <!-- Bottom dots -->
  <circle cx="236" cy="352" r="4" fill="#ff6b9d"/>
  <circle cx="252" cy="352" r="4" fill="#7c6bff"/>
  <circle cx="220" cy="352" r="4" fill="#ffffff" opacity="0.25"/>
  <circle cx="268" cy="352" r="4" fill="#ffffff" opacity="0.15"/>

  <!-- Corner accent dots -->
  <circle cx="460" cy="440" r="5" fill="#ff6b9d" opacity="0.5"/>
  <circle cx="475" cy="455" r="3" fill="#7c6bff" opacity="0.4"/>
  <circle cx="450" cy="458" r="2.5" fill="#7c6bff" opacity="0.3"/>

  <!-- Wi-fi / signal arcs (web dev) top right area -->
  <g fill="none" stroke-linecap="round" opacity="0.35">
    <path d="M440,430 Q460,415 480,430" stroke="#4ade80" stroke-width="2"/>
    <path d="M434,422 Q460,402 486,422" stroke="#4ade80" stroke-width="1.5"/>
  </g>
  <circle cx="460" cy="434" r="3" fill="#4ade80" opacity="0.5"/>

  <!-- Tiny binary decoration bottom -->
  <text x="175" y="478" font-family="monospace" font-size="11" fill="#7c6bff" opacity="0.3">01</text>
  <text x="200" y="478" font-family="monospace" font-size="11" fill="#ff6b9d" opacity="0.25">10</text>
  <text x="225" y="478" font-family="monospace" font-size="11" fill="#7c6bff" opacity="0.2">11</text>
  <text x="250" y="478" font-family="monospace" font-size="11" fill="#4ade80" opacity="0.25">01</text>
  <text x="275" y="478" font-family="monospace" font-size="11" fill="#ff6b9d" opacity="0.2">00</text>
  <text x="300" y="478" font-family="monospace" font-size="11" fill="#7c6bff" opacity="0.25">10</text>

</svg>
